# ============================================================
# CodeWhisper PR - Alembic Configuration
# ============================================================

[alembic]
script_location = alembic
sqlalchemy.url = %(here)s/.env

prepend_sys_path = .

version_path_patterns = %%(here)s/versions

version_locations = %(here)s/versions

file_template = %%(rev)s_%%(slug)s_%%(now)%%(year).%%(month).%%(day_%%H:%%M:%%S)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
level = INFO

[logger_sqlalchemy]
handlers =
level = WARN

[logger_alembic]
handlers =
level = INFO

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
