apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codewhisper-ingress
  namespace: codewhisper-pr
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - codewhisper-pr.example.com
      secretName: codewhisper-tls
  rules:
    - host: codewhisper-pr.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: codewhisper-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codewhisper-frontend
                port:
                  number: 80
