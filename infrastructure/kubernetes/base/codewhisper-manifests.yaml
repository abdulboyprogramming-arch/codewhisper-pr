apiVersion: v1
kind: Namespace
metadata:
  name: codewhisper-pr
---
apiVersion: v1
kind: Secret
metadata:
  name: codewhisper-secrets
  namespace: codewhisper-pr
type: Opaque
data:
  database-url: {{ DATABASE_URL_B64 }}
  redis-url: {{ REDIS_URL_B64 }}
  jwt-secret-key: {{ JWT_SECRET_KEY_B64 }}
  openai-api-key: {{ OPENAI_API_KEY_B64 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codewhisper-config
  namespace: codewhisper-pr
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  MAX_TOKENS: "4000"
  TEMPERATURE: "0.1"
  APP_NAME: "CodeWhisper PR"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewhisper-backend
  namespace: codewhisper-pr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codewhisper-backend
  template:
    metadata:
      labels:
        app: codewhisper-backend
    spec:
      containers:
        - name: backend
          image: codewhisper-pr/backend:{{ IMAGE_TAG }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: codewhisper-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codewhisper-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: codewhisper-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: codewhisper-secrets
                  key: jwt-secret-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codewhisper-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: codewhisper-backend
  namespace: codewhisper-pr
spec:
  selector:
    app: codewhisper-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codewhisper-frontend
  namespace: codewhisper-pr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codewhisper-frontend
  template:
    metadata:
      labels:
        app: codewhisper-frontend
    spec:
      containers:
        - name: frontend
          image: codewhisper-pr/frontend:{{ IMAGE_TAG }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://codewhisper-backend:8000/api/v1"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: codewhisper-frontend
  namespace: codewhisper-pr
spec:
  selector:
    app: codewhisper-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codewhisper-backend-hpa
  namespace: codewhisper-pr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codewhisper-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codewhisper-frontend-hpa
  namespace: codewhisper-pr
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codewhisper-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
