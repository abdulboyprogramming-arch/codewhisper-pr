name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction --no-root -C apps/backend
          yarn install --frozen-lockfile

      - name: Run linters
        run: |
          cd apps/backend && poetry run ruff check .
          yarn lint

      - name: Type checking
        run: |
          cd apps/backend && poetry run mypy src --ignore-missing-imports
          yarn type-check

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codewhisper
          POSTGRES_PASSWORD: codewhisper123
          POSTGRES_DB: codewhisper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction --no-root -C apps/backend
          yarn install --frozen-lockfile

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://codewhisper:codewhisper123@localhost:5432/codewhisper
          REDIS_URL: redis://localhost:6379
        run: |
          cd apps/backend && poetry run pytest --timeout=60
          yarn test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
